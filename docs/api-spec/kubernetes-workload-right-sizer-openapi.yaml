          description: Business criticality — drives safety margins.
          enum:
          - TIER_0
          - TIER_1
          - TIER_2
          - TIER_3
          example: TIER_0
          type: string
        analysisWindowDays:
          default: 14
          description: How much historical usage to analyze.
          example: 14
          maximum: 30
          minimum: 3
          type: integer
        workloadPattern:
          default: AUTO_DETECT
          description: Expected pattern; affects safety margins.
          enum:
          - AUTO_DETECT
          - STEADY
          - PERIODIC
          - SPIKY
          - BATCH
          - SEASONAL
          example: PERIODIC
          type: string
        safetyMarginPercent:
          default: 25
          description: Buffer above P95 usage for recommendations.
          example: 25
          maximum: 100
          minimum: 10
          type: integer
